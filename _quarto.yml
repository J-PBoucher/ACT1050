project:
  type: book

execute:
  freeze: auto

lang: fr-FR

language: 
  title-block-author-single: "Auteur"
  title-block-affiliation-single: "Session d'enseignement"
  title-block-published: "Date de création"
  title-block-modified: "Dernière modification"


book:
  title: "ACT1050 - Introduction à l'actuariat I"
  subtitle: "Fondements, assurance de personnes et régime de retraite"
  bread-crumbs: false

  sidebar:
    # logo: images/Cover_quarto.png
    logo: images/Cover_ACT1050_H2027.png
    collapse-level: 1
    search: true

  author:
    name: "Jean-Philippe Boucher"
    affiliation: "Hiver 2027"

  #cover-image: images/Cover_ACT1050.png

  chapters:
    - index.qmd
    - part: "A propos du ACT1050"
      chapters:
        - Plan_de_cours.qmd
        - Horaire.qmd
        - Politiques.qmd
        - Aproposdesnotes.qmd

    - part: "Partie I - Découvrir l'actuariat"
      chapters:
        - Chap1_IntroActu.qmd
        - Chap2_UQAMActuariat.qmd
        - Chap3_Stages.qmd
        - Chap4_Profession.qmd
        - Chap5_Adhesion.qmd
        - Chap6_Ecosysteme.qmd
        - Chap7_MilieuPratique.qmd
        - Chap8_Juridique.qmd

    - part: "Partie II - Assurance de personnes"
      chapters:
        - Chap9_Base_assurancepersonnes.qmd
        - Chap10_Actuariat_assurancepersonnes.qmd
        - Chap11_Assurancevie_temporaire.qmd
        - Chap12_Assurancevie_entiere.qmd
        - Chap13_Assurancevie_universelle.qmd
        
    - part: "Partie III - Régime de retraite"
      chapters:
        - Chap14_Fondements_retraite.qmd
        - Chap15_Actuariat_retraite.qmd
        - Chap16_Retraite_public.qmd
        - Chap17_Retraite_PD.qmd
        - Chap18_Retraite_CD.qmd
        - Chap19_Retraite_fiscal.qmd
        #- Chap20_Risques_retraite.qmd
        #- Chap21_Provisionnement.qmd

    - Conclusion.qmd

  page-footer:
    border: true
    left: "© 2026 Jean-Philippe Boucher. Tous droits réservés."
    right:
      - icon: github
        href: https://github.com/J-PBOUCHER/ACT1050
        aria-label: "Dépôt GitHub des notes de cours ACT1050"
  
format:
  html:
    embed-resources: false
    css: 
      - custom.css
      - summary.css
    include-after-body: plan_chapitre.html
    link-external-newwindow: true
    page-navigation: false
    theme: sandstone
    fontsize: 1.0em
    linestretch: 1.4
    toc-location: right
    toc-title: "Contenu du chapitre"
    grid:
      sidebar-width: 350px
      body-width: 1400px
      margin-width: 0px
      gutter-width: 1.5rem

editor: source


