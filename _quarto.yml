project:
  type: book

execute:
  freeze: auto

lang: fr-FR

language: 
  title-block-author-single: "Auteur"
  title-block-affiliation-single: "Session d'enseignement"
  title-block-published: "Date de création"
  title-block-modified: "Dernière modification"


book:
  title: "ACT1050 - Introduction à l'actuariat I"
  subtitle: "Fondements, assurance de personnes et régime de retraite"
  bread-crumbs: false

  sidebar:
    # logo: images/Cover_quarto.png
    logo: images/Cover_ACT1050_H2027.png
    collapse-level: 1
    search: true

  author:
    name: "Jean-Philippe Boucher"
    affiliation: "Hiver 2027"

  #cover-image: images/Cover_ACT1050.png

  chapters:
    - index.qmd
    - part: "A propos du ACT1050"
      chapters:
        - Plan_de_cours.qmd
        - Horaire.qmd
        - Politiques.qmd
        - Aproposdesnotes.qmd

    - part: "Partie 1 - Découvrir l'actuariat"
      chapters:
        - Chap1_IntroActu.qmd
        - Chap2_UQAMActuariat.qmd
        - Chap3_Stages.qmd
        - Chap4_Profession.qmd
        - Chap5_Adhesion.qmd

    - part: "Partie 2 - Environnement actuariel"
      chapters:
        - Chap6_Ecosysteme.qmd
        - Chap7_MilieuPratique.qmd
        - Chap8_Juridique.qmd

    - part: "Partie 3 - Assurance de personnes"
      chapters:
        - Chap9_Base_assurancevie.qmd
        - Chap10_Actuariat_assurancevie.qmd
        - Chap11_Assurancevie_temporaire.qmd
        - Chap12_Assurancevie_permanente.qmd

    - part: "Partie 4 - Régime de retraite"
      chapters:
        - Chap13_Base_retraite.qmd
        - Chap14_Actuariat_retraite.qmd
        - Chap15_Retraite_PD.qmd
        - Chap16_Retraite_CD.qmd
        - Chap17_Retraite_public.qmd
        - Chap18_Retraite_fiscal.qmd
        - Chap19_Provisionnement.qmd

    - Conclusion.qmd

  page-footer:
    border: true
    left: "© 2026 Jean-Philippe Boucher. Tous droits réservés."
    right:
      - icon: github
        href: https://github.com/J-PBOUCHER/ACT1050
        aria-label: "Dépôt GitHub des notes de cours ACT1050"
  
format:
  html:
    embed-resources: false
    css: custom.css
    page-navigation: false
    theme: sandstone
    fontsize: 1.0em
    linestretch: 1.4
    toc-location: right
    toc-title: "Contenu du chapitre"
    grid:
      sidebar-width: 300px
      body-width: 1400px
      margin-width: 0px
      gutter-width: 1.5rem
